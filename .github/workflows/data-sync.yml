# Weekly sync of city/street data from data.gov.il (Population & Immigration Authority).
#
# What it does:
#   1. Fetches latest cities + streets from the government CKAN API
#   2. Rebuilds packages/data/generated/ (skips writes if content unchanged)
#   3. Validates record counts against live CKAN
#   4. Opens a PR only when city/street/source data actually changed
#      (generatedAt-only diffs do not create a PR)
#
# Schedule: every Monday at 06:00 UTC
# Manual run: Actions tab → Data Sync → Run workflow
name: Data Sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Required for create-pull-request to open a PR with the updated data
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads pnpm version from package.json → "packageManager": "pnpm@9.15.4"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Download ~1,300 cities and ~152k street records from data.gov.il,
      # then transform into generated/cities.json + generated/streets/{code}.json
      - name: Fetch and rebuild data
        run: |
          pnpm --filter @il-address/data fetch:gov
          pnpm --filter @il-address/data build

      # Compare local manifest against live CKAN counts + anchor city checks
      # (Tel Aviv, Jerusalem, Haifa). Fails the job if counts don't match.
      - name: Validate and test
        run: |
          pnpm data:validate
          pnpm test
          pnpm build

      # Only creates a PR when city/street/source content changed.
      # generatedAt-only rebuilds leave the tree clean — no PR.
      # Review and merge manually — no auto-deploy.
      - name: Create PR if data changed
        uses: peter-evans/create-pull-request@v7
        with:
          title: "chore(data): sync from data.gov.il"
          commit-message: "chore(data): sync from data.gov.il"
          body: |
            Automated weekly sync from [data.gov.il](https://data.gov.il).

            - [ ] Review city/street count changes in `packages/data/manifest.json`
            - [ ] CI passes
          branch: chore/data-sync
          delete-branch: true
