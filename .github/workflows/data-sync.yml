name: Data Sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch and rebuild data
        run: |
          pnpm --filter @il-address/data fetch:gov
          pnpm --filter @il-address/data build

      - name: Validate and test
        run: |
          pnpm data:validate
          pnpm test
          pnpm build

      - name: Create PR if data changed
        uses: peter-evans/create-pull-request@v7
        with:
          title: "chore(data): sync from data.gov.il"
          commit-message: "chore(data): sync from data.gov.il"
          body: |
            Automated weekly sync from [data.gov.il](https://data.gov.il).

            - [ ] Review city/street count changes in `packages/data/manifest.json`
            - [ ] CI passes
          branch: chore/data-sync
          delete-branch: true
