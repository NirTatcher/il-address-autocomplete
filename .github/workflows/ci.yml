# Runs on every push to main and on all pull requests.
# Validates that the monorepo builds, tests pass, and TypeScript is clean.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads pnpm version from package.json → "packageManager": "pnpm@9.15.4"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Fail if lockfile is out of sync with package.json
      - run: pnpm install --frozen-lockfile

      # Build all packages: data → core → react
      # Build core + react (generated data is committed; no raw/ in CI)
      - run: pnpm build

      # Unit tests (normalize, search) + integration tests (real gov data)
      - run: pnpm test

      # TypeScript check across all workspace packages
      - run: pnpm typecheck
